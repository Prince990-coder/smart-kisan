<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - KhetNexus</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #f1f8f3;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .register-card h1 {
            text-align: center;
            color: #137a3a;
            margin-bottom: 8px;
        }

        .register-card p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #16833d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #106b31;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #16833d;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-page">

    <div class="register-card">

        <h1>🌾 Farmer Registration</h1>

        <p>Create your KhetNexus account</p>

        <form id="regForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label>Village / District</label>
                <input
                    type="text"
                    id="location"
                    placeholder="e.g. Jaipur"
                >
            </div>

            <div class="form-group">
                <label>Main Crop</label>
                <select id="crop">
                    <option value="">Select your crop</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Rice">Rice</option>
                    <option value="Mustard">Mustard</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Maize">Maize</option>
                    <option value="Bajra">Bajra</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Register as Farmer
            </button>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

</div>


<script>

document.getElementById("regForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const location = document.getElementById("location").value;
    const crop = document.getElementById("crop").value;
    const password = document.getElementById("password").value;

    try {

       const response = await fetch("https://smart-kisan-production-c257.up.railway.app/api/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                mobile,
                location,
                crop,
                password
            })

        });

        const data = await response.json();

        if (response.ok) {

            alert("Registration successful!");

            localStorage.setItem("smartKisanUser", name);

            window.location.href = "dashboard.html";

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Backend server se connection nahi ho pa raha.");

    }

});

</script>

</body>
</html>
