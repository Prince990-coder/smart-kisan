<script>

function logout() {
    localStorage.removeItem("smartKisanUser");
    window.location.href = "login.html";
}


async function loadWeather() {

    try {

        /* =========================
           GET LOGGED-IN USER
        ========================= */

        const storedUser =
            localStorage.getItem("smartKisanUser");

        if (!storedUser) {

            window.location.href = "login.html";
            return;

        }


        /* =========================
           HANDLE USER DATA
        ========================= */

        let user = {};

       try {

    user = JSON.parse(storedUser);

} catch (error) {

    // If localStorage contains only name
    // e.g. "Prince Kumar"

    user = {
        name: storedUser,
        location: "Jaipur"
    };

}


        /* =========================
           GET LOCATION
        ========================= */

        let location =
            user.location || "Jaipur";

        location =
            String(location).trim();

        if (!location) {
            location = "Jaipur";
        }


        document.getElementById("locationText").textContent =
            "Weather information for " + location;


        /* =========================
           DEFAULT JAIPUR COORDINATES
        ========================= */

        let latitude = 26.9124;
        let longitude = 75.7873;


        /* =========================
           LOCATION SEARCH
        ========================= */

        try {

            const geoUrl =
                "https://geocoding-api.open-meteo.com/v1/search" +
                "?name=" +
                encodeURIComponent(location) +
                "&count=1" +
                "&language=en" +
                "&format=json";


            const geoResponse =
                await fetch(geoUrl);


            if (geoResponse.ok) {

                const geoData =
                    await geoResponse.json();


                if (
                    geoData.results &&
                    geoData.results.length > 0
                ) {

                    latitude =
                        geoData.results[0].latitude;

                    longitude =
                        geoData.results[0].longitude;

                }

            }

        } catch (geoError) {

            console.warn(
                "Location search failed. Using Jaipur.",
                geoError
            );

        }


        /* =========================
           WEATHER API
        ========================= */

        const weatherUrl =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + latitude +
            "&longitude=" + longitude +
            "&current=temperature_2m,relative_humidity_2m,wind_speed_10m" +
            "&daily=precipitation_probability_max" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(weatherUrl);


        if (!weatherResponse.ok) {

            throw new Error(
                "Weather API failed: " +
                weatherResponse.status
            );

        }


        const weatherData =
            await weatherResponse.json();


        if (
            !weatherData.current ||
            !weatherData.daily
        ) {

            throw new Error(
                "Invalid weather data"
            );

        }


        const current =
            weatherData.current;


        /* =========================
           TEMPERATURE
        ========================= */

        document.getElementById("temperature")
            .textContent =
            current.temperature_2m + "°C";


        /* =========================
           HUMIDITY
        ========================= */

        document.getElementById("humidity")
            .textContent =
            current.relative_humidity_2m + "%";


        /* =========================
           WIND
        ========================= */

        document.getElementById("wind")
            .textContent =
            current.wind_speed_10m + " km/h";


        /* =========================
           RAIN
        ========================= */

        document.getElementById("rain")
            .textContent =
            weatherData.daily
                .precipitation_probability_max[0] + "%";


    } catch (error) {

        console.error(
            "Weather error:",
            error
        );


        document.getElementById("locationText")
            .textContent =
            "Weather service temporarily unavailable.";


        document.getElementById("temperature")
            .textContent = "--";


        document.getElementById("humidity")
            .textContent = "--";


        document.getElementById("wind")
            .textContent = "--";


        document.getElementById("rain")
            .textContent = "--";

    }

}


loadWeather();

</script>
